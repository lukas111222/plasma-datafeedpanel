name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip coreutils

      - name: Build release artifact without version bump
        run: ./release.sh --no-bump

      - name: Verify tag matches metadata version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          META_VERSION="$(sed -nE 's/.*"Version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' metadata.json | head -n1)"

          if [[ -z "$META_VERSION" ]]; then
            echo "Could not parse version from metadata.json" >&2
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$META_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match metadata version ($META_VERSION)." >&2
            exit 1
          fi

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.plasmoid
            dist/*.sha256
          generate_release_notes: true
